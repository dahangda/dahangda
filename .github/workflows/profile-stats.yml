name: Update profile stats

on:
  schedule:
    - cron: '23 */6 * * *' # 02:23, 08:23, 14:23, 20:23 Asia/Taipei; GitHub may delay runs.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'dahangda/dahangda' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check statistics token
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Add the PROFILE_STATS_TOKEN repository secret (classic PAT: repo and read:user).'
            exit 1
          fi

      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          token: ${{ github.token }}

      - name: Test statistics collection
        run: python3 -m unittest discover -s tests -v

      - name: Count commits across all accessible branches
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/profile_stats.py

      - name: Commit updated statistics
        shell: bash
        run: |
          set -euo pipefail
          git add -- README.md profile/commits-light.svg profile/commits-dark.svg
          if git diff --cached --quiet; then
            echo 'Statistics unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '📊 chore(profile): 更新 GitHub 全分支提交统计'
          git push origin HEAD:master
